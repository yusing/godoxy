name: Environment contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/environment-contract.yml"
      - ".gitmodules"
      - "go.mod"
      - "go.sum"
      - "cmd/env-docs-gen/**"
      - "internal/env/**"
      - ".env.example"
      - "compose.example.yml"
      # Root pushes record generated wiki changes as a submodule update.
      - "webui"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Test registry and generator
        run: |
          go test ./internal/env
          go test ./cmd/env-docs-gen
      - name: Check generated environment documentation
        run: go run ./cmd/env-docs-gen -check
