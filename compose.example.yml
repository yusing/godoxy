---
services:
  socket-proxy:
    container_name: socket-proxy
    image: ghcr.io/yusing/socket-proxy:latest
    environment:
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
      - PING=1
      - POST=1
      - VERSION=1
    volumes:
      - ${DOCKER_SOCKET:?set DOCKER_SOCKET in .env}:/var/run/docker.sock
    restart: unless-stopped
    tmpfs:
      - /run
    ports:
      - ${LISTEN_ADDR:?set LISTEN_ADDR in .env}:2375
  app:
    image: ghcr.io/yusing/godoxy:${TAG:?set TAG in .env}
    container_name: godoxy-proxy
    restart: always
    network_mode: host # do not change this
    env_file: .env
    user: ${GODOXY_UID:?set GODOXY_UID in .env}:${GODOXY_GID:?set GODOXY_GID in .env}
    depends_on:
      socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    # The WebUI is served from embedded assets by GoDoxy itself.
    # Configure its hostnames with `webui.aliases` in config/config.yml.
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./error_pages:/app/error_pages:ro
      - ./data:/app/data

      # This path stores certs obtained from autocert and agent TLS client certs
      - ./certs:/app/certs

      # mount existing certificate
      # - /path/to/certs/cert.crt:/app/certs/cert.crt
      # - /path/to/certs/priv.key:/app/certs/priv.key
